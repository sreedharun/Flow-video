<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flow Video Studio{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-icon">🎬</span>
                <span class="logo-text">Flow Video Studio</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link {% if active_page == 'create' %}active{% endif %}">✨ Create Video</a>
                <a href="/history" class="nav-link {% if active_page == 'history' %}active{% endif %}">📁 Past Jobs</a>
                <a href="/settings" class="nav-link {% if active_page == 'settings' %}active{% endif %}">⚙️ Google Login / Settings</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p>Local AI Video Automation for Google Flow &bull; Runs on your PC</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
